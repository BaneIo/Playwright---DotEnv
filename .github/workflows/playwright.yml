name: Playwright Tests - DotEnv

on:
  workflow_dispatch:
    inputs:
      test_target:
        description:
        required: true
        default: "."
      test_name:
        description:
        required: false
        default: ""
      browser:
        description:
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.browser }}" = "all" ]; then
            BROWSER_ARG=""
          else
            BROWSER_ARG="--project=${{ github.event.inputs.browser }}"
          fi

          if [ -z "${{ github.event.inputs.test_name }}" ]; then
            GREP_ARG=""
          else
            GREP_ARG="-g \"${{ github.event.inputs.test_name }}\""
          fi

          npx playwright test ${{ github.event.inputs.test_target }} $BROWSER_ARG $GREP_ARG

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ SUCCESS"
          else
            STATUS="❌ FAILURE"
          fi

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"text\": \"*Playwright Test Run Finished*\n*Status:* $STATUS\n*Target:* ${{ github.event.inputs.test_target }}\n*Browser:* ${{ github.event.inputs.browser }}\n*Report:* $REPORT_URL\" 
          }" $SLACK_WEBHOOK_URL

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7
